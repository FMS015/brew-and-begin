.pic{display:block;margin:22px auto 0;width:130px;height:auto;overflow:visible}

.pic[data-show="cup"] [data-p="cup"],.pic[data-show="sun"] [data-p="sun"],.pic[data-show="hour"] [data-p="hour"],.pic[data-show="plant"] [data-p="plant"]{display:inline}
.stroke{fill:none;stroke:var(--milk);stroke-width:3;stroke-linecap:round;stroke-linejoin:round}
.steam path{fill:none;stroke:var(--milk-dim);stroke-width:2.5;stroke-linecap:round;opacity:0}
.running .steam path{animation:steam 4.5s ease-in-out infinite}
.running .steam path:nth-child(2){animation-delay:1.6s}
@keyframes steam{0%{opacity:0;transform:translateY(6px)}40%{opacity:.5}100%{opacity:0;transform:translateY(-8px)}}
#fill{transition:transform 1s linear}#stem{transition:stroke-dashoffset 1.2s linear}
#stream{transition:opacity .6s}

.leaf{opacity:0;transform:scale(.15);transform-box:fill-box;transition:opacity 1.4s,transform 1.6s cubic-bezier(.2,.8,.2,1);fill:var(--caramel)}
.leaf.on{opacity:1;transform:scale(1)}.lL{transform-origin:100% 100%}.lR{transform-origin:0 100%}
.bloom{opacity:0;transform:scale(.2);transform-box:fill-box;transform-origin:center;transition:opacity 1.8s,transform 1.8s cubic-bezier(.2,.8,.2,1);fill:var(--caramel)}.bloom.on{opacity:1;transform:scale(1)}

@keyframes spin{to{transform:rotate(360deg)}}
.cloud{animation:drift 55s linear infinite;animation-play-state:paused}.running .cloud{animation-play-state:running}
.cloud.c2{animation-duration:90s;animation-delay:-35s}

#stars,#dawn,#glow,#rays{transition:opacity 1.5s}

.empty .grain{display:none}
@keyframes fall{0%{transform:translateY(0);opacity:0}15%{opacity:1}100%{transform:translateY(30px);opacity:.9}}

#hg{transform-box:fill-box;transform-origin:center}.flip{animation:flip 1.4s ease-in-out}

<body>

      <path class="stroke" d="M28 10H92M28 90H92M32 12L60 50L32 88M88 12L60 50L88 88"/>
    </g></g>
    <g data-p="plant">
      <g id="plantg">
        <path id="stem" class="stroke" d="M60 72C57 58 63 44 60 26" pathLength="1" stroke-dasharray="1 2" stroke-dashoffset="1"/>
        <path id="l1" class="leaf lL" d="M59 63Q42 55 38 65Q50 71 59 63Z"/>
        <path id="l2" class="leaf lR" d="M61 54Q78 46 82 56Q70 62 61 54Z"/>
        <path id="l3" class="leaf lL" d="M59 44Q45 36 42 45Q51 51 59 44Z"/>

  <div id="time" role="timer" aria-label="Time remaining">25:00</div>

          <button class="sw" data-skin="espresso" aria-label="Espresso" title="Espresso" style="background:#2B1D16;--c2:#E8B06A"></button>
          <button class="sw" data-skin="latte" aria-label="Latte" title="Latte" style="background:#F7F0E4;--c2:#7A4A1E"></button>
          <button class="sw" data-skin="rose" aria-label="Bakery rose" title="Bakery rose" style="background:#3A2530;--c2:#F2B3A8"></button>
          <button class="sw" data-skin="rain" aria-label="Rainy night" title="Rainy night" style="background:#1C2733;--c2:#F0C27B"></button>
        </div>
      </fieldset>
      <label>Timer picture
        <select id="picsel"><option value="cup">Coffee cup</option><option value="sun">Sunrise</option><option value="hour">Hourglass</option><option value="plant">Growing plant</option></select>
      </label>
      <fieldset><legend>Lengths (minutes)</legend>
        <div class="durs">
          <label>Focus<input type="number" id="d-focus" min="1" max="120" inputmode="numeric"></label>
          <label>Short<input type="number" id="d-short" min="1" max="60" inputmode="numeric"></label>
          <label>Long<input type="number" id="d-long" min="1" max="60" inputmode="numeric"></label>

      <label class="chk"><input type="checkbox" id="ask"> Ask for an intention before each focus session</label>

      <label>Ambient sound
        <select id="sound"><option value="rain">Rain</option><option value="ocean">Ocean waves</option><option value="stream">Gentle stream</option><option value="storm">Distant storm</option><option value="fire">Fireplace</option><option value="forest">Forest</option><option value="night">Summer night</option><option value="wind">Soft wind</option><option value="chimes">Wind chimes</option><option value="bowls">Singing bowls</option><option value="cafe">Café chatter</option><option value="brown">Brown noise</option></select>
      </label>

        <select id="music"><option value="keys">Soft piano</option><option value="pad">Warm pads</option><option value="box">Music box</option><option value="lofi">Lo-fi vinyl chords</option><option value="guitar">Lo-fi guitar</option><option value="bossa">Lo-fi bossa</option><option value="synth">Dreamy synth</option><option value="rainkeys">Rainy window keys</option><option value="tape">Warm tape piano</option><option value="kalimba">Soft kalimba</option><option value="ambient">Floating ambient</option><option value="waltz">Gentle waltz</option><option value="chillhop">Mellow chillhop</option><option value="celeste">Celeste sparkle</option><option value="strings">Slow strings</option><option value="dusk">Dusk piano</option><option value="hush">Quiet room</option><option value="beats">Study beats</option><option value="jazz">Late-night jazz</option><option value="drone">Deep focus</option><option value="harp">Dream harp</option><option value="minor">Midnight study</option></select>
      </label>

</main>
<footer>Shortcuts: Space starts or pauses, R resets, 1–3 switch session, J opens the jot pad.</footer>
<script>
const $=id=>document.getElementById(id);
const S={skin:"auto",pic:"cup",focus:25,short:5,long:15,ask:true,auto:false,chime:true,sound:"rain",vol:.35,music:"keys",mvol:.6};
const SNAME={rain:"Rain",ocean:"Ocean waves",stream:"Gentle stream",storm:"Distant storm",fire:"Fireplace",forest:"Forest",night:"Summer night",wind:"Soft wind",chimes:"Wind chimes",bowls:"Singing bowls",cafe:"Café chatter",brown:"Brown noise"};
const PLAB={cup:"Coffee cup that fills as your session progresses",sun:"Sun rising over hills as your session progresses",hour:"Hourglass with sand running down",plant:"Plant that grows as your session progresses"};
const ls=(k,d)=>{try{return JSON.parse(localStorage.getItem(k))??d}catch(e){return d}};
const put=(k,v)=>{try{localStorage.setItem(k,JSON.stringify(v))}catch(e){}};
Object.assign(S,ls("ct-s",{}));if(!SNAME[S.sound])S.sound="rain";
const save=()=>put("ct-s",S);
let D=ls("ct-days",{}),J=ls("ct-jots",[]),intent=ls("ct-intent","");
const dstr=o=>{const d=new Date();d.setDate(d.getDate()-o);return d.toLocaleDateString("en-CA")};
const day=()=>D[dstr(0)]||(D[dstr(0)]={n:0,m:0,log:""});

let mode="focus",total=S.focus*60,left=total,running=false,endAt=0,tick=null,done=0,note="";
const fmt=s=>String(Math.floor(s/60)).padStart(2,"0")+":"+String(s%60).padStart(2,"0");

function paint(){
  const p=1-left/total,lv=mode==="focus"?p:1-p,f=x=>x.toFixed(1),A=(i,k,v)=>$(i).setAttribute(k,v);
  $("fill").style.transform="translateY("+f((1-lv)*56)+"px)";
  const cy=94-p*54;A("sun","cy",f(cy));A("glow","cy",f(cy));A("glow","r",f(24+p*10));A("glow","opacity",(p*.4).toFixed(2));
  A("rays","transform","translate(60 "+f(cy)+")");A("rays","opacity",Math.min(1,p*1.5).toFixed(2));
  A("dawn","opacity",(p*.28).toFixed(2));A("stars","opacity",Math.max(0,1-p*1.8).toFixed(2));
  const yt=12+p*37,he=88-p*26,pk=88-p*38;
  A("sandT","d","M30 "+f(yt)+"Q60 "+f(yt+Math.min(10,50-yt))+" 90 "+f(yt)+"V50H30Z");
  A("sandB","d","M30 88V"+f(he)+"Q45 "+f(he)+" 60 "+f(pk)+"Q75 "+f(he)+" 90 "+f(he)+"V88Z");
  A("stream","d","M60 49V"+f(pk));
  const flow=running&&p<1;$("stream").style.opacity=flow?.85:0;$("hg").classList.toggle("empty",!flow);
  $("stem").style.strokeDashoffset=(1-p).toFixed(3);
  [.15,.35,.55,.75].forEach((t,i)=>$("l"+(i+1)).classList.toggle("on",p>t));$("bloom").classList.toggle("on",p>.92);
}
let journeyShownLog=null,journeyShownLogLength=0,journeyMode=null;
function journey(){
  const t=day(),el=$("journey"),visible=t.log.slice(-14);
  if(visible!==journeyShownLog){
    const fresh=journeyShownLog!==null&&t.log.length>journeyShownLogLength&&visible.endsWith("f");
    el.querySelectorAll(".tok:not(.next)").forEach(x=>x.remove());
    [...visible].forEach((c,i)=>{const s=document.createElement("span");s.className="tok "+(c==="f"?"f":"b")+(fresh&&i===visible.length-1?" fresh":"");s.setAttribute("aria-hidden","true");s.title=c==="f"?"Focus cup":"Break cup";el.insertBefore(s,el.querySelector(".next"));});
    journeyShownLog=visible;journeyShownLogLength=t.log.length;
  }
  if(!el.querySelector(".tok.next")||journeyMode!==mode){el.querySelector(".tok.next")?.remove();const n=document.createElement("span");n.className="tok next "+(mode==="focus"?"f":"b");n.setAttribute("aria-hidden","true");el.appendChild(n);journeyMode=mode}
  const f=(t.log.match(/f/g)||[]).length,b=t.log.length-f;
  el.setAttribute("aria-label","Today’s journey: "+f+" focus sessions and "+b+" breaks so far");
  $("stats").textContent=t.n+" cup"+(t.n===1?"":"s")+" earned today · "+t.m+" focused min";
}
function render(){
  $("time").textContent=fmt(left);
  document.title=(running?fmt(left)+" · ":(note?note+" · ":""))+"Corner Table";
  $("app").classList.toggle("running",running);
  $("go").textContent=running?"Pause":(left<total?"Resume":"Start");
  $("label").textContent=running?(mode==="focus"?"Stay with it. You’re doing well.":"Rest your eyes and breathe."):(left<total?"Paused.":(mode==="focus"?"Ready when you are.":"Time for a break."));
  $("aim").textContent=(mode==="focus"&&intent&&(running||left<total))?"Aiming for: "+intent:"";
  document.querySelectorAll(".tabs button").forEach(b=>b.setAttribute("aria-pressed",b.dataset.mode===mode));
  paint();journey();
}
function setMode(m){stop();mode=m;total=left=S[m]*60;const h=$("hg");h.classList.remove("flip");void h.getBoundingClientRect();h.classList.add("flip");render()}

  document.querySelectorAll(".sw").forEach(b=>b.setAttribute("aria-pressed",b.dataset.skin===S.skin));
  const h=new Date().getHours();
  $("greet").textContent=(h<5?"Late night. Go gently.":h<12?"Good morning. One cup at a time.":h<17?"Good afternoon. Settle in.":h<21?"Good evening. Slow and steady.":"Quiet hours. Go gently.");
}
document.querySelectorAll(".sw").forEach(b=>b.onclick=()=>{S.skin=b.dataset.skin;save();applySkin()});
setInterval(applySkin,60000);
function applyPic(){$("pic").dataset.show=S.pic;$("pic").setAttribute("aria-label",PLAB[S.pic])}
$("picsel").value=S.pic;$("picsel").onchange=e=>{S.pic=e.target.value;save();applyPic()};

["focus","short","long"].forEach(k=>{
  const el=$("d-"+k);el.value=S[k];
  el.onchange=()=>{let v=Math.round(+el.value)||S[k];v=Math.min(k==="focus"?120:60,Math.max(1,v));el.value=v;S[k]=v;save();if(k===mode&&!running&&left===total){total=left=v*60;render()}};
});
[["ask","ask"],["auto","auto"],["chime","chime"]].forEach(([id,k])=>{$(id).checked=S[k];$(id).onchange=e=>{S[k]=e.target.checked;save()}});
$("sound").value=S.sound;$("sound").onchange=e=>{S.sound=e.target.value;save();if(amb)ambStart();ambLabel()};
$("vol").value=S.vol;$("vol").oninput=e=>{S.vol=+e.target.value;save();if(amb){amb.g.gain.value=S.vol*amb.mult;if(amb.lg)amb.lg.gain.value=S.vol*amb.mult*amb.dep}};

function showIntent(){$("intent").hidden=false;$("iq-in").value=intent;$("iq-in").focus()}
function begin(skip){if(!skip){intent=$("iq-in").value.trim();put("ct-intent",intent)}else intent="";start()}
$("go").onclick=()=>{$("status").textContent="";if(running){stop();render()}else if(mode==="focus"&&left===total&&S.ask)showIntent();else start()};
$("begin").onclick=()=>begin(false);$("skip").onclick=()=>begin(true);
$("iq-in").onkeydown=e=>{if(e.key==="Enter")begin(false);if(e.key==="Escape")$("intent").hidden=true};
$("reset").onclick=()=>{stop();left=total;note="";$("intent").hidden=true;$("status").textContent="";render()};
document.querySelectorAll(".tabs button").forEach(b=>b.onclick=()=>{note="";$("intent").hidden=true;$("status").textContent="";setMode(b.dataset.mode)});

function renderJots(){
  const ul=$("jots");ul.textContent="";
  J.forEach((t,i)=>{const li=document.createElement("li"),s=document.createElement("span"),b=document.createElement("button");s.textContent=t;b.className="chip";b.textContent="Done";b.setAttribute("aria-label","Remove: "+t);b.onclick=()=>{J.splice(i,1);put("ct-jots",J);renderJots()};li.append(s,b);ul.appendChild(li)});
  $("jotsum").textContent="Jot pad"+(J.length?" ("+J.length+")":"");
}
function addJot(){const v=$("jot-in").value.trim();if(!v)return;J.unshift(v);put("ct-jots",J);$("jot-in").value="";renderJots()}
$("jot-add").onclick=addJot;$("jot-in").onkeydown=e=>{if(e.key==="Enter")addJot()};

function rhythm(){
  const w=$("week");w.textContent="";
  for(let o=6;o>=0;o--){const d=new Date();d.setDate(d.getDate()-o);const s=document.createElement("span"),i=document.createElement("i"),on=D[dstr(o)]&&D[dstr(o)].n>0;
    i.className=(on?"on ":"")+(o===0?"today":"");s.setAttribute("aria-label",d.toLocaleDateString("en",{weekday:"long"})+(on?": focused":": rest"));s.append(i,d.toLocaleDateString("en",{weekday:"narrow"}));w.appendChild(s)}
  const act=o=>D[dstr(o)]&&D[dstr(o)].n>0;
  let i=act(0)?0:1,st=0,rest=0;
  while(i<120){if(act(i)){st++;i++}else if(act(i+1)){rest++;i++}else break}
  let m=0;for(let o=0;o<30;o++)if(act(o))m++;
  $("streak").textContent=(st?st+(st===1?" day":" days")+" of showing up"+(rest?", with "+rest+(rest===1?" rest day":" rest days")+" along the way":"")+". Rest days are part of the rhythm. ":"A fresh start is always welcome here. ")+m+" active "+(m===1?"day":"days")+" in the last 30.";
}
$("jotbox").addEventListener("toggle",()=>{});
document.querySelectorAll("details.sec").forEach(d=>d.addEventListener("toggle",rhythm));

document.addEventListener("keydown",e=>{
  if(e.ctrlKey||e.metaKey||e.altKey||/INPUT|SELECT|TEXTAREA|BUTTON|SUMMARY/.test(e.target.tagName))return;
  if(e.code==="Space"){e.preventDefault();$("go").click()}
  else if(e.key==="r"||e.key==="R")$("reset").click();
  else if(e.key==="j"||e.key==="J"){e.preventDefault();$("jotbox").open=true;$("jot-in").focus()}
  else if(e.key==="1"||e.key==="2"||e.key==="3"){note="";setMode(["focus","short","long"][+e.key-1])}
});
applySkin();applyPic();ambLabel();renderJots();rhythm();render();
const appNav=document.createElement("nav");appNav.className="app-nav";appNav.setAttribute("aria-label","Site actions");appNav.innerHTML="<button type=\"button\" data-go-home hidden aria-label=\"Back to timer\">← Timer</button><button type=\"button\" data-screen=\"rhythm\"><span aria-hidden=\"true\">▥</span> Report</button><button type=\"button\" data-screen=\"settings\"><span aria-hidden=\"true\">⚙</span> Settings</button><button type=\"button\" data-tour-launch title=\"Help and walkthrough\" aria-label=\"Help and walkthrough\">?</button>";
const brandHome=document.createElement("a");brandHome.className="brand-home";brandHome.href="#";brandHome.setAttribute("aria-label","Corner Table home");brandHome.setAttribute("aria-current","page");const header=document.querySelector("header");brandHome.append(header.querySelector("h1"),$("greet"));header.prepend(brandHome);brandHome.addEventListener("click",e=>{e.preventDefault();showScreen("home")});
const timerCard=document.createElement("section");timerCard.className="timer-card";timerCard.setAttribute("aria-label","Pomodoro timer");const main=$("app");[main.querySelector(".tabs"),$("pic"),$("time"),$("label"),$("aim"),main.querySelector(":scope > .controls"),$("intent")].forEach(el=>timerCard.append(el));main.prepend(timerCard);const extra=document.createElement("section");extra.id="extra-view";extra.className="extra-view";extra.hidden=true;extra.setAttribute("aria-live","polite");
const detailScreens=[...document.querySelectorAll("details.sec")].filter(d=>d!==$("jotbox"));
const screenNames=["rhythm","settings"];
detailScreens.forEach((detail,i)=>{const pane=document.createElement("div");pane.dataset.screenPanel=screenNames[i];const title=document.createElement("h2");title.className="view-title";title.tabIndex=-1;title.textContent=i===0?"Report":"Settings";detail.open=true;pane.append(title,detail);extra.append(pane)});
$("jotbox").open=true;
header.append(appNav);$("app").after(extra);
function showScreen(name){const home=name==="home";appNav.querySelector("[data-go-home]").hidden=home;$("app").hidden=!home;extra.hidden=home;if(home)brandHome.setAttribute("aria-current","page");else brandHome.removeAttribute("aria-current");appNav.querySelectorAll("button[data-screen]").forEach(b=>{if(b.dataset.screen===name)b.setAttribute("aria-current","page");else b.removeAttribute("aria-current")});extra.querySelectorAll("[data-screen-panel]").forEach(p=>p.hidden=p.dataset.screenPanel!==name);if(name==="rhythm")rhythm();if(!home){const heading=extra.querySelector('[data-screen-panel="'+name+'"] .view-title');if(heading)heading.focus()}}appNav.addEventListener("click",e=>{const b=e.target.closest("button[data-screen]");if(b)showScreen(b.dataset.screen);else if(e.target.closest("[data-go-home]"))showScreen("home")});
document.addEventListener("keydown",e=>{if(e.key==="Escape"&&!extra.hidden)showScreen("home")});
const walkSteps=[
 {screen:"home",target:"header h1",title:"Welcome to Corner Table",copy:"A quiet café-inspired space for focused work, restorative breaks, and collecting small wins. Use Next to see what each part of the page does."},
 {screen:"home",target:".tabs",title:"Choose your session",copy:"Pomodoro is your focus session. Short Break and Long Break give you a moment to recharge. You can switch between them whenever you need."},
 {screen:"home",target:".controls",title:"Your timer controls",copy:"Start begins the selected session. Pause and Resume let you step away and return; Reset starts that session over. If enabled, an optional intention prompt appears before focus."},
 {screen:"home",target:"#journey",title:"Cups mark your progress",copy:"Every completed focus session earns a coffee cup in today’s journey. Breaks have their own markers, and the line below shows your focused minutes."},
 {screen:"home",target:"#jotbox",title:"Jot Pad for passing thoughts",copy:"Keep distractions here while you focus. Add a thought, then mark it Done when you’ve taken care of it. Your list is saved in this browser."},
 {screen:"rhythm",target:"[data-screen=\"rhythm\"]",title:"Report on your rhythm",copy:"See your recent focus days and streak at a glance. Rest days are part of a healthy rhythm; this view is here to encourage you."},
 {screen:"settings",target:"#themes",title:"Make the space yours",copy:"Choose a theme and timer illustration, set your focus and break lengths, and decide whether sessions start automatically or end with a chime."},
 {screen:"settings",target:"#sound",title:"Ambient sound and music",copy:"Choose a gentle background sound and one of the calm generated music patterns. Adjust their volumes independently, or leave both off for quiet."}
];
let walkIndex=0,walkTarget=null;
const walkLayer=document.createElement("div");walkLayer.id="walk-layer";walkLayer.className="walkthrough";walkLayer.hidden=true;walkLayer.innerHTML="<div class=\"walk-card\" role=\"dialog\" aria-modal=\"true\" aria-labelledby=\"walk-title\" aria-describedby=\"walk-copy\" tabindex=\"-1\"><p class=\"walk-kicker\" id=\"walk-count\"></p><button type=\"button\" class=\"walk-close\" id=\"walk-close\" aria-label=\"Close walkthrough\">×</button><h2 class=\"walk-title\" id=\"walk-title\"></h2><p class=\"walk-copy\" id=\"walk-copy\"></p><div class=\"walk-progress\" id=\"walk-progress\" aria-hidden=\"true\"></div><div class=\"walk-actions\"><button type=\"button\" id=\"walk-skip\">Skip tour</button><button type=\"button\" id=\"walk-prev\">Back</button><button type=\"button\" class=\"walk-next\" id=\"walk-next\">Next</button></div></div>";
document.body.append(walkLayer);
function clearWalkTarget(){if(walkTarget)walkTarget.classList.remove("tour-target");walkTarget=null}
function finishWalkthrough(){clearWalkTarget();walkLayer.hidden=true;put("ct-tour-seen",true);showScreen("home");brandHome.focus()}
function placeWalkTarget(){if(!walkTarget)return;const r=walkTarget.getBoundingClientRect();walkLayer.querySelector(".walk-card").dataset.placement=r.top>window.innerHeight*.62?"top":"bottom"}
function drawWalkStep(index){walkIndex=Math.max(0,Math.min(index,walkSteps.length-1));const step=walkSteps[walkIndex];showScreen(step.screen);clearWalkTarget();walkLayer.hidden=false;$("walk-count").textContent="STEP "+(walkIndex+1)+" OF "+walkSteps.length;$("walk-title").textContent=step.title;$("walk-copy").textContent=step.copy;$("walk-prev").hidden=walkIndex===0;$("walk-next").disabled=false;$("walk-next").textContent=walkIndex===walkSteps.length-1?"Finish":"Next";$("walk-progress").innerHTML=walkSteps.map((_,i)=>"<i class=\""+(i===walkIndex?"on":"")+"\"></i>").join("");walkTarget=document.querySelector(step.target);if(walkTarget){walkTarget.classList.add("tour-target");walkTarget.scrollIntoView({block:"center",behavior:matchMedia("(prefers-reduced-motion: reduce)").matches?"auto":"smooth"});requestAnimationFrame(placeWalkTarget);setTimeout(placeWalkTarget,350)}$("walk-card").focus()}
function startWalkthrough(){drawWalkStep(0)}
$("walk-next").onclick=()=>walkIndex===walkSteps.length-1?finishWalkthrough():drawWalkStep(walkIndex+1);
$("walk-prev").onclick=()=>drawWalkStep(walkIndex-1);$("walk-skip").onclick=finishWalkthrough;$("walk-close").onclick=finishWalkthrough;
appNav.addEventListener("click",e=>{if(e.target.closest("[data-tour-launch]"))startWalkthrough()});
document.addEventListener("keydown",e=>{if(!walkLayer.hidden){if(e.key==="Escape"){e.preventDefault();finishWalkthrough()}else if(e.key==="ArrowRight"){e.preventDefault();$("walk-next").click()}else if(e.key==="ArrowLeft"&&walkIndex>0){e.preventDefault();$("walk-prev").click()}}});
window.addEventListener("resize",placeWalkTarget);
if(!ls("ct-tour-seen",false))setTimeout(startWalkthrough,650);
</script>
</body>
